services:
  db:
    image: postgres:17
    container_name: order-screen-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: order_screen
    ports:
      # Host port 5434 so it never collides with a local Postgres on 5432/5433.
      - "${DB_PORT:-5434}:5432"
    volumes:
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d order_screen"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
